<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Jogador Aleatório</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-base-200 min-h-screen flex items-center justify-center p-6">

<div class="bg-base-100 shadow-2xl rounded-2xl p-10 flex flex-col items-center text-center max-w-lg w-full border border-base-300">

    <!-- Sem jogadores -->
    <div th:if="${jogador == null}" class="flex flex-col items-center">
        <div class="bg-primary/10 rounded-full p-4 mb-6">
            <img src="https://cdn-icons-png.flaticon.com/512/616/616408.png"
                 alt="Nenhum jogador encontrado"
                 class="w-28 h-28 opacity-90">
        </div>

        <h1 class="text-4xl font-bold text-primary mb-2">Jogador Aleatório</h1>
        <p class="text-xl text-gray-600 mb-6">Nenhum jogador cadastrado no momento.</p>

        <div class="flex flex-col gap-4 w-full max-w-xs">
            <a href="/" class="btn btn-outline btn-primary w-full text-center">Voltar ao Início</a>
        </div>
    </div>

    <!-- com jogadores -->
    <div th:if="${jogador != null}" class="flex flex-col items-center">
        <div class="rounded-full p-4 mb-6">
            <img th:src="${jogador.fotoUrl}" alt="Foto do jogador"
                 class="w-28 h-28 rounded-full border border-gray-300 shadow-sm">
        </div>

        <h1 class="text-4xl font-bold text-primary mb-2" th:text="${jogador.nome}">Nome do Jogador</h1>
        <p class="text-xl text-gray-600 mb-2" th:text="'País: ' + ${jogador.pais}">País</p>
        <p class="text-xl text-gray-600 mb-2" th:text="'Time: ' + ${jogador.time}">Time</p>
        <p class="text-xl text-gray-600 mb-6" th:text="'Idade: ' + ${jogador.idade}">Idade</p>

        <div class="flex flex-col gap-4 w-full max-w-xs">
            <a href="/jogadores/aleatorio" class="btn btn-primary w-full text-center">Sortear Outro Jogador</a>
            <a href="/" class="btn btn-outline btn-primary w-full text-center">Voltar ao Início</a>
        </div>
    </div>

</div>

</body>
</html>
