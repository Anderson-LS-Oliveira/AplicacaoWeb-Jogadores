<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Jogador</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-base-200 min-h-screen flex flex-col items-center justify-center p-8">

<div class="bg-base-100 rounded-2xl shadow-2xl p-10 border border-base-300 w-full max-w-lg">
    <h1 class="text-3xl font-bold text-primary text-center mb-8">Adicionar Jogador</h1>

    <form th:action="@{/jogadores/salvar}" th:object="${jogador}" method="post" class="flex flex-col gap-4">

        <div>
            <label class="label font-semibold">Nome:</label>
            <input type="text" th:field="*{nome}" placeholder="Nome do jogador"
                   class="input input-bordered w-full" required>
        </div>

        <div>
            <label class="label font-semibold">País:</label>
            <input type="text" th:field="*{pais}" placeholder="País"
                   class="input input-bordered w-full" required>
        </div>

        <div>
            <label class="label font-semibold">Time:</label>
            <input type="text" th:field="*{time}" placeholder="Time atual"
                   class="input input-bordered w-full" required>
        </div>

        <div>
            <label class="label font-semibold">Idade:</label>
            <input type="number" th:field="*{idade}" min="10" max="60"
                   class="input input-bordered w-full" required>
        </div>

        <div>
            <label class="label font-semibold">Foto (URL):</label>
            <input type="text" th:field="*{fotoUrl}" placeholder="URL da foto do jogador"
                   class="input input-bordered w-full">
        </div>

        <div class="flex justify-between mt-6">
            <a href="/jogadores" class="btn btn-outline">Cancelar</a>
            <button type="submit" class="btn btn-primary">Salvar Jogador</button>
        </div>
    </form>
</div>

</body>
</html>
